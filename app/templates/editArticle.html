{% extends "base.html" %}

{% block content %}
<h1>{{ legend }}</h1>
<form method="post">
    {{ forma.hidden_tag() }}
    <div>
        {{ forma.zagolovok.label }}<br>
        {{ forma.zagolovok(size=80, class="form-control") }}
    </div>
    <div>
        <label for="editor">Содержание</label><br>
        <textarea name="soderzhanie" id="editor" rows="15" cols="80">{{ soderzhanieRaw | safe }}</textarea>
    </div>
    <div>
        <label>Категории</label><br>
        <select name="category" multiple size="5" class="form-control">
            {% for value, label in forma.category.choices %}
                <option value="{{ value }}"
                    {% if forma.category.data is not none and value in forma.category.data %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div>
        {{ forma.submit(class="btn") }}
    </div>
</form>

<!-- Подключение CKEditor 5 с загрузчиком -->
<script src="https://cdn.ckeditor.com/ckeditor5/38.1.1/classic/ckeditor.js"></script>
<script>
    class MyUploadAdapter {
        constructor(loader) {
            this.loader = loader;
        }
        upload() {
            return this.loader.file
                .then(file => new Promise((resolve, reject) => {
                    const data = new FormData();
                    data.append('upload', file);
                    fetch('{{ url_for("main.uploadImage") }}', {
                        method: 'POST',
                        body: data
                    })
                    .then(response => response.json())
                    .then(result => {
                        if (result.url) {
                            resolve({ default: result.url });
                        } else {
                            reject(result.error);
                        }
                    })
                    .catch(err => reject(err));
                }));
        }
        abort() {}
    }

    function MyCustomUploadAdapterPlugin(editor) {
        editor.plugins.get('FileRepository').createUploadAdapter = (loader) => {
            return new MyUploadAdapter(loader);
        };
    }

    ClassicEditor
        .create(document.querySelector('#editor'), {
            toolbar: [
                'heading', '|',
                'bold', 'italic', 'underline', 'strikethrough', '|',
                'fontColor', 'fontBackgroundColor', '|',
                'bulletedList', 'numberedList', '|',
                'insertTable', '|',
                'imageUpload', '|',
                'undo', 'redo'
            ],
            image: {
                toolbar: ['imageTextAlternative']
            },
            extraPlugins: [MyCustomUploadAdapterPlugin],
            table: {
                contentToolbar: ['tableColumn', 'tableRow', 'mergeTableCells']
            }
        })
        .catch(error => {
            console.error(error);
        });
</script>
{% endblock %}
