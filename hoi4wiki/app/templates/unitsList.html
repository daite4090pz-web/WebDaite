{% extends "base.html" %}
{% block content %}
<h1>Юниты</h1>
<ul>
{% for u in unity %}
    <li>
        <a href="{{ url_for('main.unitDetail', id=u.id) }}">{{ u.nazvanie }}</a> ({{ u.tip }})
        {% if current_user.is_admin %}
            <a href="{{ url_for('main.editUnit', id=u.id) }}">[ред.]</a>
        {% endif %}
    </li>
{% endfor %}
</ul>
{% if current_user.is_admin %}
    <a href="{{ url_for('main.newUnit') }}">Добавить юнит</a>
{% endif %}
{% endblock %}
