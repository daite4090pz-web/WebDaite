{% extends "base.html" %}
{% block content %}
<h1>Технологии</h1>
<ul>
{% for t in tehnologii %}
    <li>
        <a href="{{ url_for('main.technologyDetail', id=t.id) }}">{{ t.nazvanie }}</a> ({{ t.era }})
        {% if current_user.is_admin %}<a href="{{ url_for('main.editTechnology', id=t.id) }}">[ред.]</a>{% endif %}
    </li>
{% endfor %}
</ul>
{% if current_user.is_admin %}<a href="{{ url_for('main.newTechnology') }}">Добавить технологию</a>{% endif %}
{% endblock %}
